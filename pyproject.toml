[project]
name = "so101-test"
version = "0.1.0"
description = "SO-101 robot arm training and deployment with SmolVLA, ACT, CNN, and FC policies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[smolvla,dataset,feetech]==0.7.0",
    "torch[device-gfx1151]==2.15.0+rocm10.2.0",
    "torchvision[device-gfx1151]==0.29.2+rocm10.2.0",
    "numpy",
    "pandas",
    "matplotlib",
    "av",
    "opencv-python",
    "huggingface-hub",
    "ultralytics>=8.4.123",
]

[tool.uv]
exclude-dependencies = ["opencv-python-headless"]
index-strategy = "unsafe-best-match"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "amd-rocm-whl-next" }
torchvision = { index = "amd-rocm-whl-next" }

[[tool.uv.index]]
name = "amd-rocm-whl-next"
url = "https://stable.repo.amd.com/rocm/whl-next/"
